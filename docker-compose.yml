
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cutter-ai-backend
    ports:
      - "8000:8000"
    environment:
      APP_NAME: CUTTER AI
      APP_VERSION: 1.0.0
      MAX_UPLOAD_SIZE_MB: 1024
      WHISPER_MODEL: base
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2
    volumes:
      - cutter_storage:/app/storage
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: cutter-ai-ollama
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  cutter_storage:
  ollama_models:
