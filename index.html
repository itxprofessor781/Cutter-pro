
<script>
const $ = id => document.getElementById(id);

let projects = [];
let clips = [];
let selectedFile = null;
let pollTimer = null;
let activeJobId = null;

const headings = {
  dashboard: "Dashboard",
  create: "Create Clips",
  projects: "My Projects",
  editor: "Video Editor",
  templates: "Templates",
  downloads: "Downloads",
  settings: "Settings"
};

function apiBase() {
  return (
    localStorage.getItem("cutter_api") ||
    $("apiUrl").value ||
    ""
  ).trim().replace(/\/+$/, "");
}

function showPage(page) {
  document.querySelectorAll(".page").forEach(p =>
    p.classList.add("hidden-page")
  );

  $(page).classList.remove("hidden-page");

  document.querySelectorAll(".nav").forEach(n =>
    n.classList.toggle("active", n.dataset.page === page)
  );

  $("pageHeading").textContent = headings[page] || "Dashboard";
  $("breadcrumb").textContent = page.toUpperCase();

  if (page === "projects") loadProjects();
  if (page === "downloads") renderDownloads();
  if (page === "dashboard") {
    loadProjects();
  }
}

document.querySelectorAll(".nav").forEach(n => {
  n.addEventListener("click", () => showPage(n.dataset.page));
});

$("apiUrl").value = localStorage.getItem("cutter_api") || "";

function saveSettings() {
  const value = $("apiUrl").value.trim().replace(/\/+$/, "");

  if (!value) {
    $("connectionMessage").textContent =
      "Please enter your backend URL.";
    return;
  }

  localStorage.setItem("cutter_api", value);
  $("connectionMessage").textContent = "API URL saved successfully.";
}

async function request(path, options = {}) {
  const base = apiBase();

  if (!base) {
    throw new Error(
      "Backend URL missing. Open Settings and connect your API."
    );
  }

  const response = await fetch(base + path, options);

  let data = {};

  try {
    data = await response.json();
  } catch {}

  if (!response.ok) {
    throw new Error(
      data.detail || data.message || "Request failed: " + response.status
    );
  }

  return data;
}

// BACKEND CONNECTION TEST
async function testConnection() {
  $("connectionMessage").textContent = "Checking backend connection...";

  try {
    const data = await request("/api/health");

    $("connectionMessage").textContent =
      "Connected successfully! " +
      (data.message || data.status || "Backend is online.");
  } catch (e) {
    $("connectionMessage").textContent =
      "Connection error: " + e.message;
  }
}

// YOUTUBE IMPORT
async function checkYoutube() {
  const url = $("youtubeUrl").value.trim();

  if (!url) {
    $("youtubeMessage").textContent = "Please paste a YouTube URL.";
    return;
  }

  if (!/^https?:\/\/(www\.)?(youtube\.com|youtu\.be)\//i.test(url)) {
    $("youtubeMessage").textContent = "Invalid YouTube URL.";
    return;
  }

  $("youtubeMessage").textContent =
    "YouTube import is not available in the current backend. " +
    "Please download or use a video file you are authorized to process.";
}

// FILE SELECTION
const dz = $("dropzone");
const fileInput = $("videoFile");

dz.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", e => {
  selectFile(e.target.files[0]);
});

dz.addEventListener("dragover", e => {
  e.preventDefault();
  dz.classList.add("drag");
});

dz.addEventListener("dragleave", () => {
  dz.classList.remove("drag");
});

dz.addEventListener("drop", e => {
  e.preventDefault();
  dz.classList.remove("drag");
  selectFile(e.dataTransfer.files[0]);
});

function selectFile(file) {
  if (!file) return;

  const allowed = [
    "mp4", "mov", "webm", "mkv", "avi", "m4v"
  ];

  const ext = file.name.split(".").pop().toLowerCase();

  if (!allowed.includes(ext)) {
    $("fileName").textContent = "Unsupported file type.";
    selectedFile = null;
    return;
  }

  selectedFile = file;

  $("fileName").textContent =
    "✓ " + file.name +
    " (" + (file.size / 1024 / 1024).toFixed(1) + " MB)";
}

// START VIDEO PROCESSING
async function startProcessing() {
  if (!selectedFile) {
    $("processingMessage").textContent =
      "Please select a video file first.";
    return;
  }

  if (!apiBase()) {
    $("processingMessage").textContent =
      "Connect your backend first in Settings.";
    return;
  }

  const btn = $("startBtn");

  btn.disabled = true;
  btn.textContent = "Uploading video...";

  $("uploadProgress").classList.remove("hidden");
  $("progressBar").style.width = "0%";
  $("progressNumber").textContent = "0%";
  $("progressText").textContent = "Uploading video...";
  $("processingMessage").textContent = "";

  try {
    // STEP 1: UPLOAD VIDEO
    const form = new FormData();
    form.append("file", selectedFile);

    const uploadData = await uploadWithProgress(form);

    if (!uploadData.job || !uploadData.job.job_id) {
      throw new Error("Backend did not return a valid Job ID.");
    }

    const jobId = uploadData.job.job_id;
    activeJobId = jobId;

    $("progressBar").style.width = "100%";
    $("progressNumber").textContent = "100%";
    $("progressText").textContent = "Upload completed";

    $("processingMessage").textContent =
      "Video uploaded. Starting AI processing...";

    // STEP 2: START AI PROCESSING
    const language = $("captionLanguage").value;

    const processData = await request(
      "/api/process/" + encodeURIComponent(jobId),
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          number_of_clips: Number($("clipCount").value),
          min_duration: 15,
          max_duration: 60,
          language: language === "none" ? null : language
        })
      }
    );

    if (!processData.job) {
      throw new Error("Processing response is missing Job information.");
    }

    $("processingMessage").textContent =
      "AI processing started successfully. Please wait...";

    $("progressText").textContent = "AI processing started";
    $("progressNumber").textContent = "1%";
    $("progressBar").style.width = "1%";

    btn.textContent = "Processing...";

    await loadProjects();

    // STEP 3: WATCH JOB
    watchJob(jobId);

  } catch (e) {
    $("processingMessage").textContent =
      "Error: " + e.message;

    btn.disabled = false;
    btn.textContent = "✦ Generate AI Clips";
  }
}

// UPLOAD WITH LIVE PROGRESS
function uploadWithProgress(form) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();

    xhr.open("POST", apiBase() + "/api/upload");

    xhr.upload.onprogress = e => {
      if (e.lengthComputable) {
        const percent = Math.round((e.loaded / e.total) * 100);

        $("progressBar").style.width = percent + "%";
        $("progressNumber").textContent = percent + "%";
        $("progressText").textContent = "Uploading video...";
      }
    };

    xhr.onload = () => {
      let data = {};

      try {
        data = JSON.parse(xhr.responseText);
      } catch {}

      if (xhr.status >= 200 && xhr.status < 300) {
        resolve(data);
      } else {
        reject(
          new Error(
            data.detail ||
            data.message ||
            "Upload failed: " + xhr.status
          )
        );
      }
    };

    xhr.onerror = () => {
      reject(new Error("Network error during video upload."));
    };

    xhr.onabort = () => {
      reject(new Error("Video upload was cancelled."));
    };

    xhr.send(form);
  });
}

// WATCH PROCESSING STATUS
function watchJob(jobId) {
  if (pollTimer) {
    clearInterval(pollTimer);
  }

  pollTimer = setInterval(async () => {
    try {
      const data = await request(
        "/api/jobs/" + encodeURIComponent(jobId)
      );

      const job = data.job;

      if (!job) {
        throw new Error("Job information not found.");
      }

      const progress = Math.min(
        100,
        Number(job.progress || 0)
      );

      $("progressBar").style.width = progress + "%";
      $("progressNumber").textContent = progress + "%";
      $("progressText").textContent =
        job.stage || job.status || "Processing";

      if (job.status === "completed") {
        clearInterval(pollTimer);
        pollTimer = null;

        $("processingMessage").textContent =
          "✓ Processing completed! Your clips are ready.";

        $("startBtn").disabled = false;
        $("startBtn").textContent = "✦ Generate AI Clips";

        await loadProjects();
        await loadClips(jobId);
      }

      if (job.status === "failed") {
        clearInterval(pollTimer);
        pollTimer = null;

        $("processingMessage").textContent =
          "Processing failed: " + (job.error || "Unknown error");

        $("startBtn").disabled = false;
        $("startBtn").textContent = "✦ Generate AI Clips";

        await loadProjects();
      }

    } catch (e) {
      $("processingMessage").textContent =
        "Status check failed: " + e.message;

      clearInterval(pollTimer);
      pollTimer = null;

      $("startBtn").disabled = false;
      $("startBtn").textContent = "✦ Generate AI Clips";
    }
  }, 3000);
}

// LOAD ALL JOBS
async function loadProjects() {
  try {
    const data = await request("/api/jobs");

    projects = Array.isArray(data.jobs) ? data.jobs : [];

    renderProjects();

    // Collect clips from all jobs
    clips = [];

    projects.forEach(job => {
      (job.clips || []).forEach(clip => {
        clips.push({
          ...clip,
          job_id: job.job_id
        });
      });
    });

    updateStats();

  } catch (e) {
    $("projectList").innerHTML =
      '<div class="panel p-6 small">Unable to load projects: ' +
      escapeHtml(e.message) + '</div>';
  }
}

// DISPLAY PROJECTS
function renderProjects() {
  const container = $("projectList");

  if (!projects.length) {
    container.innerHTML =
      '<div class="panel p-8 small">No projects available yet.</div>';
    updateStats();
    return;
  }

  container.innerHTML = projects.map(job => `
    <div class="panel p-5">
      <div class="font-bold">
        ${escapeHtml(job.filename || "Untitled video")}
      </div>

      <div class="small mt-2">
        Status: ${escapeHtml(job.status || "Unknown")}
      </div>

      <div class="small mt-1">
        Progress: ${Number(job.progress || 0)}%
      </div>

      <div class="progress mt-3">
        <div style="width:${Math.min(100, Number(job.progress || 0))}%"></div>
      </div>

      <div class="small mt-3">
        ${escapeHtml(job.stage || "")}
      </div>

      <button
        class="text-purple-300 text-sm mt-4"
        onclick="loadClips('${escapeAttr(job.job_id)}')">
        View clips →
      </button>
    </div>
  `).join("");

  updateStats();
}

// LOAD CLIPS FOR A JOB
async function loadClips(jobId) {
  try {
    const data = await request(
      "/api/jobs/" + encodeURIComponent(jobId)
    );

    const job = data.job;

    if (!job) {
      throw new Error("Job not found.");
    }

    clips = (job.clips || []).map(clip => ({
      ...clip,
      job_id: jobId
    }));

    renderDownloads();
    showPage("downloads");

  } catch (e) {
    alert("Could not load clips: " + e.message);
  }
}

// DOWNLOADS PAGE
function renderDownloads() {
  const container = $("downloadList");

  const completed = clips.filter(
    clip => clip.status === "completed"
  );

  if (!completed.length) {
    container.innerHTML =
      '<div class="panel p-8 small">No completed downloads yet.</div>';
    return;
  }

  container.innerHTML = completed.map(clip => {
    const downloadUrl =
      apiBase() +
      "/api/download/" +
      encodeURIComponent(clip.job_id) +
      "/" +
      encodeURIComponent(clip.clip_id);

    return `
      <div class="panel p-5 flex flex-col md:flex-row justify-between gap-4 items-start md:items-center">

        <div>
          <div class="font-bold">
            ${escapeHtml(clip.title || clip.filename || "Generated clip")}
          </div>

          <div class="small mt-2">
            Duration: ${escapeHtml(clip.duration ?? "N/A")} seconds
          </div>

          <div class="small mt-1">
            Score: ${escapeHtml(clip.score ?? "N/A")}
          </div>

          <div class="small mt-1">
            ${escapeHtml(clip.reason || "")}
          </div>
        </div>

        <a
          class="btn gradient inline-block text-sm"
          href="${escapeAttr(downloadUrl)}"
          download>
          ↓ Download MP4
        </a>

      </div>
    `;
  }).join("");
}

// DASHBOARD STATISTICS
function updateStats() {
  const allClips = [];

  projects.forEach(job => {
    (job.clips || []).forEach(clip => {
      allClips.push(clip);
    });
  });

  const completedClips = allClips.filter(
    clip => clip.status === "completed"
  );

  $("totalProjects").textContent = projects.length;
  $("totalClips").textContent = allClips.length;
  $("totalDownloads").textContent = completedClips.length;

  $("recentProjects").innerHTML = projects.length
    ? projects.slice(0, 4).map(job => `
        <div class="py-3 border-b border-[#29293b]">
          ${escapeHtml(job.filename || "Untitled video")}
          <span class="float-right small">
            ${escapeHtml(job.status || "Unknown")}
          </span>
        </div>
      `).join("")
    : "No projects yet. Create your first video project.";
}

// LOCAL VIDEO PREVIEW
$("previewFile").addEventListener("change", e => {
  const file = e.target.files[0];

  if (!file) return;

  const video = $("previewVideo");

  if (video.dataset.objectUrl) {
    URL.revokeObjectURL(video.dataset.objectUrl);
  }

  const objectUrl = URL.createObjectURL(file);

  video.dataset.objectUrl = objectUrl;
  video.src = objectUrl;
  video.classList.remove("hidden");
});

// SAFE HTML OUTPUT
function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}

function escapeAttr(value) {
  return escapeHtml(value);
}

// INITIAL LOAD
updateStats();

if (apiBase()) {
  loadProjects();
}
</script>
