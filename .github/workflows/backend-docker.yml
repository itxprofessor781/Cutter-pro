
name: CUTTER AI Backend Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-checks:
    name: Build and Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t cutter-ai-backend:latest \
            .

      - name: Run Backend Tests
        run: |
          docker run --rm cutter-ai-backend:latest \
            python -m pytest -q

